name: Changes Filter
description: |
  Pure filter over a set of changed files. Takes a JSON array of file paths
  and determines whether any match the provided criteria.

  Default mode: matches paths against glob patterns.
  Supports * (within a segment) and ** (any depth).

  Custom mode: runs a caller-supplied bash script. The script receives
  CHANGED_FILES as a JSON array via environment variable and signals a match
  via exit code — exit 0 means matched, non-zero means not matched.

  The caller is responsible for providing the file list. This keeps the action
  decoupled from any event type or API.

inputs:
  changed-files:
    description: Optional JSON array of changed file paths.
    required: false
    default: ""
  base:
    description: Git base revision used when changed-files is omitted.
    required: false
    default: ""
  head:
    description: Git head revision used with base; defaults to HEAD.
    required: false
    default: "HEAD"
  paths:
    description: |
      Newline-separated list of glob patterns (default mode).
      Supports:
        *   matches any characters within a single path segment
        **  matches any characters across path segments
        /   trailing slash matches a folder prefix
      Examples:
        .github/actions/test-uv/
        .github/workflows/release-python.yml
        src/**/*.py
        Dockerfile
    required: false
    default: ""
  items:
    description: |
      JSON array of named path-prefix items. When supplied, the action returns
      the items whose `path` contains at least one changed file. Example:
      '[{"id":"github","path":"collaboration/github/"}]'.
    required: false
    default: "[]"
  filter-script:
    description: |
      Bash script (custom mode). When provided, `paths` is ignored.
      Receives CHANGED_FILES as a JSON array via environment variable.
      Exit 0 = matched, non-zero = not matched.
      Example:
        echo "$CHANGED_FILES" | python3 -c "
          import sys, json
          files = json.load(sys.stdin)
          exit(0 if any(f.startswith('src/') for f in files) else 1)
        "
    required: false
    default: ""

outputs:
  matched:
    description: "'true' if any file matched, 'false' otherwise"
    value: ${{ steps.extract.outputs.matched }}
  matched-files:
    description: |
      JSON array of changed file paths that matched the filter (paths mode only).
      Empty array in custom script or item mode, or when nothing matched.
    value: ${{ steps.extract.outputs.matched-files }}
  matched-items:
    description: JSON array of caller-supplied items selected by changed paths.
    value: ${{ steps.extract.outputs.matched-items }}

runs:
  using: composite
  steps:
    - name: Collect changed files
      id: changed
      shell: bash
      env:
        CHANGED_FILES: ${{ inputs.changed-files }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        if [ -n "$CHANGED_FILES" ]; then
          files=$CHANGED_FILES
        else
          [ -n "$BASE" ] || { echo "changed-files or base is required" >&2; exit 2; }
          files=$(git diff --name-only "$BASE" "$HEAD" | jq -Rsc 'split("\n") | map(select(length > 0))')
        fi
        jq -e . >/dev/null <<<"$files"
        echo "files=$files" >> "$GITHUB_OUTPUT"
    - name: Match paths
      id: match-paths
      if: ${{ inputs.filter-script == '' }}
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.changed.outputs.files }}
        PATTERNS: ${{ inputs.paths }}
        ITEMS: ${{ inputs.items }}
      run: |
        output_file=$(mktemp "$RUNNER_TEMP/filter-result-XXXXXX.json")
        OUTPUT_FILE="$output_file" python3 "$GITHUB_ACTION_PATH/match-paths.py"
        echo "output-file=$output_file" >> "$GITHUB_OUTPUT"

    # ── Custom mode: caller-supplied bash script ─────────────────────────────
    - name: Run custom filter script
      id: match-script
      if: ${{ inputs.filter-script != '' }}
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.changed.outputs.files }}
        FILTER_SCRIPT: ${{ inputs.filter-script }}
      run: |
        output_file=$(mktemp "$RUNNER_TEMP/filter-result-XXXXXX.json")
        echo "$FILTER_SCRIPT" > /tmp/_filter_script.sh
        if bash /tmp/_filter_script.sh; then
          echo '{"matched":true,"files":[]}' > "$output_file"
        else
          echo '{"matched":false,"files":[]}' > "$output_file"
        fi
        echo "output-file=$output_file" >> "$GITHUB_OUTPUT"

    # ── Extract outputs from result file ─────────────────────────────────────
    - name: Extract outputs
      id: extract
      shell: bash
      env:
        OUTPUT_FILE: ${{ steps.match-paths.outputs.output-file || steps.match-script.outputs.output-file }}
      run: |
        echo "matched=$(jq -r '.matched' "$OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
        echo "matched-files=$(jq -c '.files // []' "$OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
        echo "matched-items=$(jq -c '.items // []' "$OUTPUT_FILE")" >> "$GITHUB_OUTPUT"
